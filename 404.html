<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>Page not found - Hasana</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231c5a42'/%3E%3Cg transform='translate(16,16) scale(2.833)'%3E%3Cpath d='M5 20V11.5C5 7.9 8.1 5 12 5S19 7.9 19 11.5V20' fill='none' stroke='%23f6f1e0' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 20v-6a3 3 0 0 1 6 0v6' fill='none' stroke='%23f6f1e0' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('hasana-theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* storage unavailable */ }
        })();
    </script>
    <!-- Deliberately self-contained: no stylesheet, no script, no font file.
         This page is served for any missing path at any depth, and the app's CSS
         filename carries a content hash that changes with every release - linking
         it would leave the 404 page unstyled the moment it did (it already did,
         2026-10-16). It needs about fifteen lines; they live here. -->
    <style>
        :root {
            --color-paper: oklch(96.6% 0.009 85);
            --color-ink: oklch(24.5% 0.012 85);
            --color-ink-2: oklch(44% 0.011 85);
            --color-accent-text: oklch(43% 0.09 160);
        }
        :root:not([data-theme="light"]) {
            @media (prefers-color-scheme: dark) {
                --color-paper: oklch(16.5% 0.014 160);
                --color-ink: oklch(93% 0.008 90);
                --color-ink-2: oklch(73% 0.008 90);
                --color-accent-text: oklch(70% 0.09 160);
            }
        }
        :root[data-theme="dark"] {
            --color-paper: oklch(16.5% 0.014 160);
            --color-ink: oklch(93% 0.008 90);
            --color-ink-2: oklch(73% 0.008 90);
            --color-accent-text: oklch(70% 0.09 160);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            background-color: var(--color-paper);
            color: var(--color-ink);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.6;
        }
        .main-content { width: 100%; max-width: 40rem; padding: 2rem 1rem; }
        .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 2rem; }
        .brand-mark svg { width: 28px; height: 28px; color: var(--color-accent-text); }
        h1 { margin: 0; font-size: 1.35rem; }
        p { color: var(--color-ink-2); }
        a { color: var(--color-accent-text); }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="site-header">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 20V11.5C5 7.9 8.1 5 12 5s7 2.9 7 6.5V20"/>
                            <path d="M9 20v-6a3 3 0 0 1 6 0v6"/>
                        </svg>
                    </span>
                    <h1>Hasana</h1>
                </div>
            </header>
            <p>Page not found.</p>
            <p lang="ar" dir="rtl">الصفحة غير موجودة.</p>
            <p><a href="/">Back to Hasana</a> · <a href="/?lang=ar" lang="ar" dir="rtl">العودة إلى حسنة</a></p>
        </main>
    </div>
</body>
</html>
